<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>데이터 분석 챗봇</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <h1>데이터 분석 챗봇</h1>

      <section class="panel">
        <h2>데이터 업로드</h2>
        <label class="file-drop" id="file-drop">
          <input type="file" id="file-input" accept=".csv,.xlsx,.xls" hidden />
          <span id="file-label">CSV / Excel 파일 선택</span>
        </label>
        <p class="status" id="upload-status"></p>
      </section>

      <section class="panel summary-panel" id="summary-panel" hidden>
        <h2>데이터 요약</h2>
        <div class="meta" id="summary-meta"></div>
        <details>
          <summary>전체 요약 보기</summary>
          <pre id="summary-text"></pre>
        </details>
      </section>

      <button class="secondary" id="reset-btn">새 대화</button>
    </aside>

    <main class="chat">
      <div class="messages" id="messages">
        <div class="message assistant">
          <div class="bubble">
            검사 데이터를 업로드하고 분석하고 싶은 내용을 질문해 주세요.<br />
            분석 조건과 실행할 Pandas 코드를 제안해 드립니다.
          </div>
        </div>
      </div>
      <form class="composer" id="composer">
        <textarea id="input" rows="2" placeholder="예: 라인별 불량률을 집계하고 그래프로 보여줘" required></textarea>
        <button type="submit" id="send-btn">전송</button>
      </form>
    </main>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
