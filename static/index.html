<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>데이터 분석 챗봇</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
  <script>
    // 저장된 테마를 먼저 적용해 깜빡임을 막는다
    document.documentElement.dataset.theme =
      localStorage.getItem("theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  </script>
</head>
<body>
  <div class="app">
    <!-- 사이드바 -->
    <aside class="sidebar">
      <div class="brand">
        <div class="logo">D</div>
        <span class="brand-name">데이터 분석 챗봇</span>
      </div>

      <button class="btn primary new-chat" id="reset-btn" type="button">＋ 새 대화</button>

      <p class="nav-section">대화 기록</p>
      <nav class="history" id="history">
        <p class="history-empty">저장된 대화가 없습니다.</p>
      </nav>

      <p class="nav-section">데이터</p>
      <div class="data-empty" id="data-empty">
        <img src="/static/icons/chart.svg" width="18" height="18" alt="" />
        <span>업로드된 파일 없음</span>
      </div>
      <div class="data-card" id="data-card" hidden>
        <div class="data-title" id="data-name"></div>
        <div class="data-meta">
          <span class="badge positive">불러옴</span>
          <span id="data-shape"></span>
        </div>
        <div class="data-cols" id="data-cols"></div>
      </div>

      <div class="sidebar-foot">
        <span class="badge">1단계 · 분석 계획/코드 제안</span>
      </div>
    </aside>

    <!-- 메인 -->
    <div class="main">
      <header class="topbar">
        <p class="breadcrumb">워크스페이스 &nbsp;/&nbsp; 데이터 분석</p>
        <div class="spacer"></div>
        <button class="btn outline sm icon-only" id="theme-btn" type="button" title="테마 전환" aria-label="테마 전환">
          <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
          <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </header>

      <main class="chat" id="chat">
        <div class="thread" id="messages">
          <section class="welcome" id="welcome">
            <div class="page-header">
              <h1>무엇을 분석해 드릴까요?</h1>
              <p>검사 데이터(CSV/Excel)를 첨부하고 질문하면 분석 조건과 실행할 Pandas 코드를 제안해 드립니다.</p>
            </div>
            <div class="suggestions">
              <button type="button" class="suggestion card">
                <span class="label">구조 확인</span>
                <span class="text">이 데이터의 구조와 결측치를 확인해줘</span>
              </button>
              <button type="button" class="suggestion card">
                <span class="label">집계 · 시각화</span>
                <span class="text">라인별 불량률을 집계하고 그래프로 보여줘</span>
              </button>
              <button type="button" class="suggestion card">
                <span class="label">탐색</span>
                <span class="text">불량과 관련 있어 보이는 변수를 찾아줘</span>
              </button>
            </div>
          </section>
        </div>
      </main>

      <footer class="composer-wrap">
        <form class="composer card" id="composer">
          <textarea id="input" rows="1" placeholder="메시지를 입력하세요  (Shift+Enter 줄바꿈)"></textarea>
          <div class="composer-actions">
            <label class="btn outline sm" title="CSV / Excel 첨부">
              <input type="file" id="file-input" accept=".csv,.xlsx,.xls" hidden />
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
              파일 첨부
            </label>
            <span class="attached" id="attached"></span>
            <div class="spacer"></div>
            <button type="submit" class="btn primary" id="send-btn">전송</button>
          </div>
        </form>
        <p class="hint">챗봇은 코드를 직접 실행하지 않습니다. 제안된 코드를 실행해 결과를 원본과 대조해 주세요.</p>
      </footer>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
